{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Flashcard Generator{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'submissions/app.css' %}">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main" class="main">
        {% if messages %}
        <div class="messages" aria-live="polite" role="status">
            <ul class="message-list">
                {% for message in messages %}
                <li class="message message--{{ message.tags|default:'info' }}">
                    <span class="message__prefix">{{ message.tags|default:'info'|capfirst }}:</span>
                    {{ message }}
                </li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
