<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Flashcard Generator</title>
<style>
    body {
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
        width: 260px;
        margin: 0;
        padding: 12px;
    }
    button {
        width: 100%;
        padding: 8px;
        font-size: 14px;
        cursor: pointer;
    }
    button:disabled {
        cursor: default;
        opacity: 0.6;
    }
    #status {
        margin-top: 10px;
        min-height: 2.8em;
        color: #333;
    }
    #status.status--error {
        color: #b00020;
    }
</style>
</head>
<body>
    <button id="generate" type="button">Generate flashcards from this page</button>
    <p id="status">Ready.</p>
    <script src="popup.js"></script>
</body>
</html>
