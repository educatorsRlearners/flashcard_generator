<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Flashcard Generator</title>
<style>
    :root {
        --color-bg: #ffffff;
        --color-text: #333333;
        --color-text-muted: #666666;
        --color-error: #b00020;
        --color-border: #cccccc;
        --color-focus: #2f6fed;
        --color-spinner-track: #cccccc;
        --color-spinner-active: #333333;
        color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --color-bg: #1e1e1e;
            --color-text: #e8e8e8;
            --color-text-muted: #a8a8a8;
            --color-error: #ff6b6b;
            --color-border: #555555;
            --color-focus: #6ea0ff;
            --color-spinner-track: #555555;
            --color-spinner-active: #e8e8e8;
        }
    }
    body {
        font: 0.875rem/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
        width: 260px;
        margin: 0;
        padding: 12px;
        background: var(--color-bg);
        color: var(--color-text);
    }
    button {
        box-sizing: border-box;
        width: 100%;
        padding: 8px;
        font-size: 0.875rem;
        cursor: pointer;
    }
    button:disabled {
        cursor: default;
        opacity: 0.6;
    }
    button:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
    }
    .status-row {
        margin-top: 10px;
        min-height: 2.8em;
        display: flex;
        align-items: flex-start;
    }
    /* Lightweight CSS spinner shown next to the status text for every
       in-progress stage (connecting / reading / generating) - a cold
       start can leave the text unchanged for up to 30s, so this keeps the
       popup from reading as frozen. Hidden (via the `hidden` attribute)
       for the terminal Ready/Done/Error states. */
    .spinner {
        flex: none;
        width: 12px;
        height: 12px;
        margin: 3px 8px 0 0;
        border: 2px solid var(--color-spinner-track);
        border-top-color: var(--color-spinner-active);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
        .spinner {
            animation: none;
            opacity: 0.6;
        }
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    #status {
        margin: 0;
        color: var(--color-text);
    }
    #status.status--error {
        color: var(--color-error);
    }
    label.deck-label {
        display: block;
        margin-top: 10px;
        font-weight: 600;
    }
    #deck-select, #deck-new, #provider-select, #model-select {
        box-sizing: border-box;
        width: 100%;
        margin-top: 4px;
        padding: 6px;
        font-size: 0.8125rem;
        background: var(--color-bg);
        color: var(--color-text);
        border: 1px solid var(--color-border);
    }
    #deck-note {
        margin: 4px 0 0;
        font-size: 0.75rem;
        color: var(--color-text-muted);
    }
    .deck-hint {
        margin: 4px 0 0;
        font-size: 0.75rem;
        color: var(--color-text-muted);
    }
    #deck-select:focus-visible, #deck-new:focus-visible,
    #provider-select:focus-visible, #model-select:focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 2px;
    }
    #llm-key-banner {
        margin: 8px 0 0;
        font-size: 0.75rem;
        color: var(--color-error);
    }
</style>
</head>
<body>
    <label class="deck-label" for="provider-select">Provider:</label>
    <select id="provider-select">
        <option value="">Loading providers…</option>
    </select>
    <label class="deck-label" for="model-select">Model:</label>
    <select id="model-select">
        <option value="">Loading models…</option>
    </select>
    <p id="llm-key-banner" role="status" aria-live="polite" hidden></p>
    <button id="generate" type="button">Generate flashcards from this page</button>
    <label class="deck-label" for="deck-select">Anki deck (optional):</label>
    <select id="deck-select" aria-describedby="deck-optional-hint">
        <option value="">Loading decks…</option>
    </select>
    <p id="deck-optional-hint" class="deck-hint">Optional here — you can still choose at review Finish.</p>
    <label class="deck-label" for="deck-new">Or new deck name:</label>
    <input id="deck-new" type="text" placeholder="Type a new deck name" autocomplete="off" aria-describedby="deck-wins-hint deck-optional-hint">
    <p id="deck-wins-hint" class="deck-hint">If both are filled, the new deck name wins.</p>
    <p id="deck-note" role="status" aria-live="polite"></p>
    <div class="status-row">
        <span id="spinner" class="spinner" aria-hidden="true" hidden></span>
        <p id="status" role="status" aria-live="polite">Ready.</p>
    </div>
    <script src="popup.js"></script>
</body>
</html>
