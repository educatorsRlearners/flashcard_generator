<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Flashcard Generator: turn any web page into reviewed, spaced-repetition Anki flashcards">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="cardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfbff"/>
      <stop offset="100%" stop-color="#e6e8fd"/>
    </linearGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="soft-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- soft decorative dot grid, top-right -->
  <g fill="#818cf8" opacity="0.16">
    <circle cx="1085" cy="55" r="3"/>
    <circle cx="1123" cy="86" r="3"/>
    <circle cx="1152" cy="48" r="3"/>
    <circle cx="1100" cy="126" r="3"/>
    <circle cx="1150" cy="155" r="3"/>
    <circle cx="1062" cy="196" r="3"/>
    <circle cx="1140" cy="228" r="3"/>
    <circle cx="1180" cy="112" r="3"/>
  </g>

  <!-- two-card stack + review checkmark -->
  <g transform="translate(140,150)" filter="url(#soft-shadow)">
    <rect x="-58" y="-14" width="150" height="104" rx="16" fill="url(#cardBack)" transform="rotate(-7)"/>
    <rect x="-42" y="-38" width="150" height="104" rx="16" fill="url(#cardFront)"/>
    <line x1="-20" y1="-14" x2="76" y2="-14" stroke="#4338ca" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <line x1="-20" y1="2"   x2="88" y2="2"   stroke="#818cf8" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <line x1="-20" y1="18"  x2="52" y2="18"  stroke="#818cf8" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <circle cx="88" cy="46" r="26" fill="url(#check)" stroke="#0f172a" stroke-width="3"/>
    <path d="M 77 46 L 85 54 L 100 37" fill="none" stroke="#f0fdf4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="330" y="146" font-size="52" font-weight="700" letter-spacing="-0.5" fill="#f8fafc">Flashcard Generator</text>
    <text x="332" y="184" font-size="20" fill="#c7d2fe">Any web page &#8594; reviewed, spaced-repetition cards &#8594; Anki</text>
  </g>

  <!-- accent rule -->
  <rect x="332" y="201" width="600" height="3" rx="1.5" fill="#818cf8" opacity="0.55"/>
</svg>
