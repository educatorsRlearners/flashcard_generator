<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flashcard Generator">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- soft decorative dot grid -->
  <g fill="#818cf8" opacity="0.18">
    <circle cx="1080" cy="60" r="3"/>
    <circle cx="1120" cy="90" r="3"/>
    <circle cx="1150" cy="50" r="3"/>
    <circle cx="1100" cy="130" r="3"/>
    <circle cx="1150" cy="160" r="3"/>
    <circle cx="1060" cy="200" r="3"/>
    <circle cx="1140" cy="230" r="3"/>
  </g>

  <!-- stacked flashcards icon -->
  <g transform="translate(110,150)">
    <rect x="-46" y="-6" width="150" height="98" rx="14" fill="url(#card1)" transform="rotate(-9)"/>
    <rect x="-38" y="-18" width="150" height="98" rx="14" fill="url(#card2)" transform="rotate(-1)"/>
    <rect x="-30" y="-30" width="150" height="98" rx="14" fill="url(#card3)"/>
    <text x="45" y="12" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic"
          fill="#4c1d95" text-anchor="middle">Aa</text>
    <line x1="-8" y1="30" x2="98" y2="30" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round"/>
    <line x1="-8" y1="44" x2="70" y2="44" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="330" y="150" font-size="54" font-weight="700" fill="#f8fafc">Flashcard Generator</text>
    <text x="332" y="188" font-size="21" fill="#c7d2fe">Any web page &#8594; reviewed, spaced-repetition cards &#8594; Anki</text>
  </g>

  <!-- accent rule -->
  <rect x="332" y="205" width="640" height="3" rx="1.5" fill="#818cf8" opacity="0.6"/>
</svg>
