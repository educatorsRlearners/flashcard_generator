[project]
name = "flashcard-generator"
version = "0.1.0"
description = "Flashcard generator walking skeleton"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "trafilatura>=1.8",
    "playwright>=1.40",
    "pdfminer.six>=20231228",
    "anthropic>=0.40",
    "sentence-transformers>=2.7",
    "huey>=2.5",
    "pillow>=10.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
